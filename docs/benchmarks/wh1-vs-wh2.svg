<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="470" viewBox="0 0 1020 470" role="img" aria-labelledby="title description"><title id="title">Wirehair 1 vs Wirehair 2 lifecycle time</title><desc id="description">Two panels compare 64-byte and 1280-byte blocks at K=8, 128, 512, 1024. Lower time is better; both axes are logarithmic. WH2 is slower at all 64-byte points and faster at 1280 bytes except K=8. Rounded one-host no-loss diagnostic timings, not recovery or universal speed evidence.</desc><rect width="1020" height="470" fill="white" /><text x="510" y="31" fill="#243447" font-size="23" font-family="sans-serif" text-anchor="middle">Wirehair 1 vs Wirehair 2</text><text x="510" y="55" fill="#243447" font-size="15" font-family="sans-serif" text-anchor="middle">No-loss lifecycle · lower is better · logarithmic axes</text><line x1="310" y1="80" x2="338" y2="80" stroke="#0072b2" stroke-width="3" stroke-dasharray="none" /><text x="346" y="85" fill="#243447" font-size="14" font-family="sans-serif">Wirehair 1</text><line x1="505" y1="80" x2="533" y2="80" stroke="#c45100" stroke-width="3" stroke-dasharray="7 4" /><text x="541" y="85" fill="#243447" font-size="14" font-family="sans-serif">Wirehair 2 (default)</text><text x="277.0" y="115" fill="#243447" font-size="17" font-family="sans-serif" text-anchor="middle">B = 64 bytes per block</text><line x1="84" y1="370.0" x2="470" y2="370.0" stroke="#dde3e9" /><text x="74" y="375.0" fill="#243447" font-size="12" font-family="sans-serif" text-anchor="end">0.002</text><line x1="84" y1="314.0823996531185" x2="470" y2="314.0823996531185" stroke="#dde3e9" /><text x="74" y="319.0823996531185" fill="#243447" font-size="12" font-family="sans-serif" text-anchor="end">0.01</text><line x1="84" y1="234.0823996531185" x2="470" y2="234.0823996531185" stroke="#dde3e9" /><text x="74" y="239.0823996531185" fill="#243447" font-size="12" font-family="sans-serif" text-anchor="end">0.1</text><line x1="84" y1="154.0823996531185" x2="470" y2="154.0823996531185" stroke="#dde3e9" /><text x="74" y="159.0823996531185" fill="#243447" font-size="12" font-family="sans-serif" text-anchor="end">1</text><line x1="84" y1="130.0" x2="470" y2="130.0" stroke="#dde3e9" /><text x="74" y="135.0" fill="#243447" font-size="12" font-family="sans-serif" text-anchor="end">2</text><line x1="84.0" y1="130" x2="84.0" y2="370" stroke="#eef1f4" /><text x="84.0" y="392" fill="#243447" font-size="13" font-family="sans-serif" text-anchor="middle">8</text><line x1="304.57142857142856" y1="130" x2="304.57142857142856" y2="370" stroke="#eef1f4" /><text x="304.57142857142856" y="392" fill="#243447" font-size="13" font-family="sans-serif" text-anchor="middle">128</text><line x1="414.85714285714283" y1="130" x2="414.85714285714283" y2="370" stroke="#eef1f4" /><text x="414.85714285714283" y="392" fill="#243447" font-size="13" font-family="sans-serif" text-anchor="middle">512</text><line x1="470.0" y1="130" x2="470.0" y2="370" stroke="#eef1f4" /><text x="470.0" y="392" fill="#243447" font-size="13" font-family="sans-serif" text-anchor="middle">1024</text><text x="277.0" y="420" fill="#243447" font-size="14" font-family="sans-serif" text-anchor="middle">Original blocks (K)</text><text x="26" y="250.0" fill="#243447" font-size="14" font-family="sans-serif" text-anchor="middle" transform="rotate(-90 26 250.0)">Lifecycle time (ms)</text><polyline points="84.000,355.913 304.571,277.091 414.857,224.436 470.000,192.183" fill="none" stroke="#0072b2" stroke-width="2.5" stroke-dasharray="none" /><circle cx="84.0" cy="355.9126992755455" r="4" fill="#0072b2"><title>Wirehair 1: K=8, B=64, 0.003 ms</title></circle><circle cx="304.57142857142856" cy="277.090559821202" r="4" fill="#0072b2"><title>Wirehair 1: K=128, B=64, 0.029 ms</title></circle><circle cx="414.85714285714283" cy="224.4364851566505" r="4" fill="#0072b2"><title>Wirehair 1: K=512, B=64, 0.132 ms</title></circle><circle cx="470.0" cy="192.18268230819334" r="4" fill="#0072b2"><title>Wirehair